<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>K-Gganbu 백오피스</title>
<!--
  백오피스 (PRD REQ-BO-1~4 / docs/SYSTEMS_DESIGN.md §3)
  - PC 전용: 정보 밀도가 무기다. 한 화면에서 비교·판단이 끝나야 한다.
  - 모든 숫자는 서버 집계(bo_* → backoffice EF)에서 온다. 이 화면은 계산하지 않는다.
  - 인증: Google 로그인(ADMIN_EMAILS) 또는 Admin Key. admin.html 과 동일 체계.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --blue:#0EA5E9; --coral:#FF6B6B; --teal:#0D9488; --amber:#F59E0B;
    --ok:#16A34A; --err:#DC2626;
    --bg:#F4F4F5; --card:#fff; --line:#E4E4E7; --ink:#18181B; --dim:#71717A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;
         display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  header h1{font-size:16px;margin:0;letter-spacing:-.3px}
  header .spacer{flex:1}
  .layout{display:flex;min-height:calc(100vh - 53px)}
  nav{width:190px;background:#fff;border-right:1px solid var(--line);padding:12px 0}
  nav button{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
             padding:11px 18px;font-size:13.5px;color:var(--dim);border-left:3px solid transparent}
  nav button:hover{background:#FAFAFA;color:var(--ink)}
  nav button.on{color:var(--ink);font-weight:700;border-left-color:var(--blue);background:#F0F9FF}
  nav .navlabel{padding:8px 18px 4px;font-size:11px;color:#A1A1AA;letter-spacing:.4px}
  main{flex:1;padding:18px 22px 60px;max-width:1400px}
  h2{font-size:15px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12px;margin:0 0 14px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .label{font-size:12px;color:var(--dim)}
  .kpi .value{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
  .kpi .note{font-size:11.5px;color:var(--dim);margin-top:3px}
  .kpi.warn{border-color:#FCA5A5;background:#FEF2F2}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card h3{font-size:13.5px;margin:0 0 10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #F4F4F5}
  th{color:var(--dim);font-weight:600;font-size:12px;cursor:pointer;user-select:none}
  tbody tr:hover{background:#FAFAFA}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:8px;border-radius:4px;background:#E4E4E7;overflow:hidden}
  .bar>span{display:block;height:8px;background:var(--blue)}
  .funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .step{border:1px solid var(--line);border-radius:10px;padding:12px}
  .step .n{font-size:22px;font-weight:800}
  .step .r{font-size:12px;color:var(--dim)}
  .drop{color:var(--err);font-weight:700}
  button.act{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;
             font-weight:700;cursor:pointer;font-size:13px}
  button.act.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  input,select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
  .banner{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;font-weight:600}
  .banner.risk{background:#FEF2F2;border:1px solid #FCA5A5;color:#991B1B}
  .muted{color:var(--dim)}
  .spark{display:flex;align-items:flex-end;gap:3px;height:60px}
  .spark div{flex:1;background:var(--blue);border-radius:2px 2px 0 0;min-height:2px}
  .defn{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>K-Gganbu 백오피스</h1>
  <span class="muted" id="range"></span>
  <div class="spacer"></div>
  <select id="days" onchange="reload()">
    <option value="7">최근 7일</option>
    <option value="30" selected>최근 30일</option>
    <option value="90">최근 90일</option>
  </select>
  <input id="key" placeholder="Admin Key (또는 Google 로그인)" style="width:230px" />
  <span id="authBox"><button class="act ghost" onclick="signIn()">Google 로그인</button></span>
  <span id="userBox" style="display:none">
    <span class="muted" id="userEmail"></span>
    <button class="act ghost" onclick="signOut()">로그아웃</button>
  </span>
</header>

<div class="layout">
  <nav>
    <div class="navlabel">경영</div>
    <button id="nav-overview" class="on" onclick="go('overview')">대시보드 (사장)</button>
    <div class="navlabel">실무</div>
    <button id="nav-product" onclick="go('product')">제품 (PO)</button>
    <button id="nav-merchandising" onclick="go('merchandising')">딜·인벤토리 (MD)</button>
    <button id="nav-growth" onclick="go('growth')">채널·유입 (마케팅)</button>
    <button id="nav-data" onclick="go('data')">데이터 (분석)</button>
    <div class="navlabel">운영</div>
    <button id="nav-system" onclick="go('system')">시스템</button>
    <div class="navlabel">연결</div>
    <button onclick="location.href='admin.html'">파트너·쿠폰 등록 →</button>
    <button onclick="location.href='partner.html'">파트너 포털 미리보기 →</button>
  </nav>

  <main>
    <div id="risk" class="banner risk" style="display:none"></div>
    <div id="view"></div>
  </main>
</div>

<script>
const SUPABASE_URL = 'https://ltdajglszqkgneegjryb.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0ZGFqZ2xzenFrZ25lZWdqcnliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0Njk4NjcsImV4cCI6MjA5NzA0NTg2N30.uTpHH13tH3Pd-jbpSB6-x-fhRHhryrbgG3IJ4-gnYoo';
const BASE = SUPABASE_URL + '/functions/v1';
const $ = (id) => document.getElementById(id);
const sb = window.supabase.createClient(SUPABASE_URL, ANON_KEY);
$('key').value = localStorage.getItem('kgb_admin_key') || '';
let section = 'overview';
const num = (n) => (n ?? 0).toLocaleString();

async function signIn() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google', options: { redirectTo: location.origin + location.pathname },
  });
  if (error) alert('로그인 실패: ' + error.message);
}
async function signOut(){ await sb.auth.signOut(); renderAuth(null); }
function renderAuth(session){
  const on = !!session;
  $('authBox').style.display = on ? 'none' : '';
  $('userBox').style.display = on ? '' : 'none';
  if (on) $('userEmail').textContent = session.user.email || '';
}
sb.auth.onAuthStateChange((_e, s) => { renderAuth(s); if (s) reload(); });
sb.auth.getSession().then(({ data }) => { renderAuth(data.session); if (data.session) reload(); });

// 집계 호출 — 모든 화면이 이 함수 하나만 쓴다(지표 정의가 갈라지지 않도록)
async function fetchSection(name, days) {
  const key = $('key').value.trim();
  const { data } = await sb.auth.getSession();
  const jwt = data.session?.access_token;
  if (!jwt && !key) throw new Error('Google 로그인 또는 Admin Key가 필요합니다');
  if (key) localStorage.setItem('kgb_admin_key', key);
  const headers = { 'Content-Type':'application/json', 'apikey': ANON_KEY,
                    'Authorization':'Bearer ' + (jwt || ANON_KEY) };
  if (key) headers['x-admin-key'] = key;
  const res = await fetch(BASE + '/backoffice', {
    method:'POST', headers, body: JSON.stringify({ section: name, days: Number(days) }),
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
  return j.data;
}

function go(name){
  section = name;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('on'));
  const el = $('nav-' + name); if (el) el.classList.add('on');
  reload();
}

function kpi(label, value, note, warn){
  return '<div class="kpi' + (warn ? ' warn' : '') + '"><div class="label">' + label + '</div>' +
         '<div class="value">' + value + '</div>' +
         (note ? '<div class="note">' + note + '</div>' : '') + '</div>';
}

// 표 — 정렬 가능 + CSV (REQ-BO-3, 개인식별자는 애초에 응답에 없다)
function table(id, cols, rows){
  const head = cols.map((c,i) => '<th class="' + (c.num?'num':'') + '" onclick="sortTable(\\'' + id + '\\',' + i + ')">' + c.t + '</th>').join('');
  const body = rows.map(r => '<tr>' + cols.map(c =>
      '<td class="' + (c.num?'num':'') + '">' + (r[c.k] ?? '') + '</td>').join('') + '</tr>').join('');
  return '<table id="' + id + '"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>' +
         '<button class="act ghost" style="margin-top:10px" onclick="csv(\\'' + id + '\\')">CSV 내보내기</button>';
}
function sortTable(id, col){
  const t = $(id); const rows = [...t.tBodies[0].rows];
  const dir = t.dataset.dir === String(col) ? -1 : 1;
  t.dataset.dir = dir === 1 ? String(col) : '';
  rows.sort((a,b) => {
    const x = a.cells[col].innerText.replace(/[,%]/g,''), y = b.cells[col].innerText.replace(/[,%]/g,'');
    const nx = parseFloat(x), ny = parseFloat(y);
    if (!isNaN(nx) && !isNaN(ny)) return (nx-ny)*dir;
    return x.localeCompare(y)*dir;
  });
  rows.forEach(r => t.tBodies[0].appendChild(r));
}
function csv(id){
  const t = $(id);
  const lines = [...t.rows].map(r => [...r.cells].map(c => '"' + c.innerText.replace(/"/g,'""') + '"').join(','));
  const blob = new Blob(['\\uFEFF' + lines.join('\\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = id + '.csv'; a.click();
}

async function reload(){
  const days = $('days').value;
  $('range').textContent = '최근 ' + days + '일';
  const view = $('view');
  view.innerHTML = '<p class="muted">불러오는 중…</p>';
  try {
    if (section === 'overview') return renderOverview(await fetchSection('overview', days), days);
    if (section === 'product') return renderProduct(await fetchSection('product', days));
    if (section === 'merchandising') return renderMd(await fetchSection('merchandising', days));
    if (section === 'growth') return renderGrowth(await fetchSection('growth', days));
    if (section === 'data') return renderData(await fetchSection('timeseries', days));
    if (section === 'system') return renderSystem(await fetchSection('system', days));
  } catch (e) {
    view.innerHTML = '<div class="card"><b>조회 실패</b><p class="muted">' + e.message + '</p>' +
      '<p class="muted">우측 상단에서 Google 로그인(ADMIN_EMAILS 등록 계정) 또는 Admin Key를 입력하세요.</p></div>';
  }
}

function renderOverview(d, days){
  // 위험 신호는 색이 아니라 위치로 — 상단 고정 배너(REQ-BO-4)
  const risks = [];
  if ((d.points_debt ?? 0) > 100000) risks.push('포인트 부채 ' + num(d.points_debt) + 'P — 발행 캡 점검');
  if ((d.coupons_issued ?? 0) > 0 && (d.use_rate ?? 0) < 10)
    risks.push('쿠폰 사용률 ' + d.use_rate + '% — 딜 구성/노출 점검(MD 탭)');
  $('risk').style.display = risks.length ? '' : 'none';
  $('risk').textContent = risks.join('  ·  ');

  $('view').innerHTML =
    '<h2>경영 대시보드</h2><p class="sub">북극성 지표와 수익·리스크를 한 화면에서 본다.</p>' +
    '<div class="kpis">' +
      kpi('북극성 · 활동자 1인당 쿠폰 사용', d.uses_per_active, '사용 ' + num(d.coupons_used) + ' / 활동자 ' + num(d.active_users)) +
      kpi('쿠폰 사용률', (d.use_rate ?? 0) + '%', '발급 ' + num(d.coupons_issued) + ' → 사용 ' + num(d.coupons_used)) +
      kpi('신규 사용자', num(d.new_users), days + '일 누적') +
      kpi('AI 질문', num(d.ai_asks), '변동비 지표 (BM§3.3)') +
    '</div>' +
    '<div class="kpis">' +
      kpi('포인트 부채', num(d.points_debt) + 'P', '미사용·미소멸 잔액', (d.points_debt ?? 0) > 100000) +
      kpi('오늘 발행 포인트', num(d.points_issued_today) + 'P', '일 상한은 서버 강제') +
      kpi('활동 사용자', num(d.active_users), days + '일 내 이벤트 발생') +
      kpi('기간', days + '일', '상단에서 변경') +
    '</div>' +
    '<div class="card"><h3>지표 정의</h3><div class="defn">' +
      '· <b>북극성</b>: 여행 1건당 쿠폰·티켓 사용(BM§7). 여행 단위 데이터가 쌓이기 전까지는 <b>활동자 1인당 사용 건수</b>로 대체한다.<br>' +
      '· <b>포인트 부채</b>: 소멸 전 미사용 잔액 합. 발행 원가 리스크(BM§3.5)로, 급증하면 적립 캡을 조정한다.<br>' +
      '· <b>활동 사용자</b>: 기간 내 analytics 이벤트를 1건 이상 발생시킨 고유 사용자.' +
    '</div></div>';
}

function renderProduct(d){
  $('risk').style.display = 'none';
  const f = d.funnel;
  const steps = f.map((s, i) => {
    const prev = i ? f[i-1].n : 0;
    const rate = i && prev ? Math.round(s.n * 1000 / prev)/10 : null;
    const drop = rate !== null && rate < 50;
    return '<div class="step"><div class="r">' + s.step + '</div><div class="n">' + num(s.n) + '</div>' +
      (rate !== null ? '<div class="r ' + (drop?'drop':'') + '">전 단계 대비 ' + rate + '%</div>' : '<div class="r">시작</div>') +
      '</div>';
  }).join('');
  const feats = Object.entries(d.features).map(([k,v]) => ({ k, v: num(v) }));
  $('view').innerHTML =
    '<h2>제품 (PO)</h2><p class="sub">전환이 어디서 끊기는지, 만든 기능이 실제로 쓰이는지 본다.</p>' +
    '<div class="card"><h3>쿠폰 전환 퍼널</h3><div class="funnel">' + steps + '</div>' +
      '<div class="defn">단계 간 전환율이 50% 미만이면 빨갛게 표시된다 — 다음 스프린트 후보다. ' +
      '사용(used)은 이벤트가 아니라 coupon_issues.used_at 실측이다.</div></div>' +
    '<div class="card"><h3>기능 사용량</h3>' +
      table('tblFeat', [{t:'기능',k:'k'},{t:'건수',k:'v',num:true}], feats) + '</div>' +
    '<div class="card"><h3>이벤트</h3>' +
      table('tblEv', [{t:'이벤트',k:'k'},{t:'건수',k:'v',num:true}],
        Object.entries(d.events).map(([k,v]) => ({k, v:num(v)}))) +
      (d.open_reports ? '<p class="muted" style="margin-top:10px">미처리 신고 ' + d.open_reports + '건 — 시스템 탭에서 처리</p>' : '') +
    '</div>';
}

function renderMd(d){
  // 앱에 실제로 뜨지 않는 쿠폰이 있으면 그게 1순위 문제다 — 파트너는 "운영 중"으로 알고 있다
  const risks = [];
  if (d.coupons_expired) risks.push('기간 만료 쿠폰 ' + d.coupons_expired + '건 — 파트너 화면엔 운영 중으로 보이나 앱에는 노출되지 않음');
  if (d.partners_without_coords) risks.push('좌표 없는 파트너 ' + d.partners_without_coords + '곳 — 앱 딜 매칭(LBS) 제외');
  $('risk').style.display = risks.length ? '' : 'none';
  $('risk').textContent = risks.join('  ·  ');

  const cat = Object.entries(d.by_category).map(([k,v]) => k + ' ' + v).join(' · ') || '없음';
  const EXPIRY = { ok:'', soon:'⏳ 7일 내 만료', expired:'⛔ 만료' };
  const rows = (d.deals || []).map(x => ({ ...x,
    app: x.visible ? '노출' : '미노출',
    state: EXPIRY[x.expiry] || '' }));
  $('view').innerHTML =
    '<h2>딜·인벤토리 (MD)</h2><p class="sub">무엇을 더 넣고 무엇을 뺄지 — 사용률로 판단한다. 앱 노출 여부는 앱과 같은 기준으로 판정한다.</p>' +
    '<div class="kpis">' +
      kpi('앱 노출 중인 딜', num(d.coupons_visible), '활성 ' + num(d.coupons_active) + '건 중') +
      kpi('기간 만료', num(d.coupons_expired), '앱 미노출', d.coupons_expired > 0) +
      kpi('7일 내 만료', num(d.coupons_expiring_soon), '연장 협의 대상', d.coupons_expiring_soon > 0) +
      kpi('좌표 없는 파트너', num(d.partners_without_coords), '딜 매칭 불가', d.partners_without_coords > 0) +
    '</div>' +
    '<div class="kpis">' +
      kpi('활성 파트너', num(d.partners_total), '') +
      kpi('활성 쿠폰', num(d.coupons_active), cat) +
      kpi('사용 합계', num((d.deals||[]).reduce((s,x)=>s+Number(x.used),0)), '기간 내') +
      kpi('발급 합계', num((d.deals||[]).reduce((s,x)=>s+Number(x.issued),0)), '기간 내') +
    '</div>' +
    '<div class="card"><h3>딜 성과 (사용률 순)</h3>' +
      table('tblDeals', [
        {t:'쿠폰',k:'title'},{t:'파트너',k:'partner'},{t:'카테고리',k:'category'},
        {t:'앱',k:'app'},{t:'상태',k:'state'},
        {t:'발급',k:'issued',num:true},{t:'사용',k:'used',num:true},{t:'사용률%',k:'use_rate',num:true},
      ], rows) +
      '<div class="defn">‘앱’ 열은 <b>앱과 동일한 판정</b>(status=active 그리고 유효기간 내)이다. ' +
      '미노출인데 파트너가 모르고 있으면 그게 가장 먼저 풀 문제다. ' +
      '사용률이 낮은 딜은 조건이 매력적이지 않거나 노출 위치가 잘못됐다는 신호다.</div></div>';
}

function renderGrowth(d){
  $('risk').style.display = 'none';
  const dev = Object.entries(d.devices).map(([k,v]) => k + ' ' + v).join(' · ') || '없음';
  $('view').innerHTML =
    '<h2>채널·유입 (마케팅)</h2><p class="sub">어느 채널이 실제로 사람을 데려오는가.</p>' +
    '<div class="kpis">' +
      kpi('랜딩 방문', num((d.channels||[]).reduce((s,c)=>s+Number(c.visits),0)), '채널 ' + (d.channels||[]).length + '종') +
      kpi('티켓 아웃링크', num(d.ticket_outlinks), '외부 예매 이동') +
      kpi('알림 기기', num(Object.values(d.devices).reduce((s,v)=>s+Number(v),0)), dev) +
      kpi('푸시 발송', '—', 'admin.html 에서 발송') +
    '</div>' +
    '<div class="card"><h3>채널별 유입</h3>' +
      table('tblCh', [{t:'채널(ch)',k:'ch'},{t:'방문',k:'visits',num:true}], d.channels || []) +
      '<div class="defn">QR 인쇄물·게임 공유 링크는 `?ch=` 파라미터로 구분된다(예: terminal-a, game_share). ' +
      '크루즈 채널 CAC≈0 가설(BM E2) 검증에 쓴다.</div></div>';
}

function renderData(rows){
  $('risk').style.display = 'none';
  const max = Math.max(1, ...rows.map(r => Number(r.events)));
  const spark = rows.map(r => '<div style="height:' + Math.round(Number(r.events)*100/max) + '%" title="' + r.day + ': ' + r.events + '"></div>').join('');
  $('view').innerHTML =
    '<h2>데이터 (분석)</h2><p class="sub">일별 시계열과 원본 내보내기.</p>' +
    '<div class="card"><h3>일별 이벤트</h3><div class="spark">' + spark + '</div></div>' +
    '<div class="card"><h3>일별 지표</h3>' +
      table('tblTs', [
        {t:'날짜(KST)',k:'day'},{t:'이벤트',k:'events',num:true},{t:'발급',k:'issued',num:true},
        {t:'사용',k:'used',num:true},{t:'포인트 발행',k:'points',num:true},
      ], rows) +
      '<div class="defn">모든 날짜는 KST 기준이다(적립·상한도 동일 기준). ' +
      'CSV에는 개인식별자가 포함되지 않는다 — 집계 응답 자체에 없다.</div></div>';
}

function renderSystem(d){
  const usage = Object.entries(d.usage_today || {});
  $('risk').style.display = d.open_reports ? '' : 'none';
  if (d.open_reports) $('risk').textContent = '미처리 신고 ' + d.open_reports + '건';
  $('view').innerHTML =
    '<h2>시스템</h2><p class="sub">한도·큐·데이터 위생.</p>' +
    '<div class="kpis">' +
      kpi('미처리 신고', num(d.open_reports), 'admin.html 통계 탭에서 확인', d.open_reports > 0) +
      kpi('알림 기기', num(d.device_tokens), '') +
      kpi('7일 내 소멸 포인트', num(d.points_expiring_7d) + 'P', '소멸 배치 확인') +
      kpi('90일 초과 위치 핑', num(d.location_pings_old), '자동 삭제 대상', d.location_pings_old > 0) +
    '</div>' +
    '<div class="card"><h3>오늘 사용량(상한 대상)</h3>' +
      (usage.length
        ? table('tblUsage', [{t:'종류',k:'k'},{t:'오늘 합계',k:'v',num:true}], usage.map(([k,v]) => ({k, v:num(v)})))
        : '<p class="muted">오늘 기록 없음</p>') +
      '<div class="defn">AI 챗·음성 세션은 사용자별 일 상한이 서버에서 강제된다(초과 시 429). ' +
      '여기 합계가 급증하면 변동비(BM§3.3)를 먼저 확인한다.</div></div>';
}
</script>
</body>
</html>
